version: '3.8'

services:
  pharma-ai:
    build: .
    container_name: pharma-innovation-ai
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
    networks:
      - pharma-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: pharma-ai-cache
    ports:
      - "6379:6379"
    networks:
      - pharma-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: pharma-ai-db
    environment:
      - POSTGRES_DB=pharma_ai
      - POSTGRES_USER=pharma_admin
      - POSTGRES_PASSWORD=secure_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pharma-network
    restart: unless-stopped

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: pharma-metrics
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - pharma-network
    restart: unless-stopped

networks:
  pharma-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
